name: Refresh contribution artwork

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, profile/kuromi-clean]
    paths:
      - 'scripts/contributions*'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-artwork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test generator
        run: node --test scripts/contributions.test.mjs
      - name: Read public contribution calendar
        run: node scripts/contributions.mjs
      - name: Commit updated artwork
        run: |
          git add assets/contributions.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh contribution artwork"
          git push
